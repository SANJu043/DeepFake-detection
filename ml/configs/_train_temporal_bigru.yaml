model:
  name: temporal_bigru
  input_size: 1792
  hidden_size: 256
  num_layers: 2
  dropout: 0.3

data:
  root: ./data/features
  num_workers: 0
  max_seq_len: 30

training:
  batch_size: 4
  lr: 0.0005
  lr_min: 0.000001
  weight_decay: 0.0001
  epochs: 5
  patience: 5
  amp: false
  output_dir: ./checkpoints
